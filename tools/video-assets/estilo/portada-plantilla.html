<!doctype html>
<!--
  Plantilla de PORTADA (1080×1920) en el mismo estilo que los vídeos: producto 3D real sobre la
  pista de noche. El scaffolder la copia al proyecto como cover.html. Rellena las zonas marcadas
  EDITAR con el mismo gancho que el Frame 1 y un dato REAL de la guía/ficha (nunca inventado).
  Contenido dentro del 83% superior (≤ 1594px). Rasterizar con chrome --headless --screenshot.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'DM Serif Display'; src: url("assets/fonts/DMSerifDisplay-Regular.woff2") format('woff2'); }
  @font-face { font-family: 'DM Sans'; src: url("assets/fonts/DMSans-Variable.woff2") format('woff2'); font-weight: 100 1000; }
  @font-face { font-family: 'Space Grotesk'; src: url("assets/fonts/SpaceGrotesk-Variable.woff2") format('woff2'); font-weight: 100 1000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070907; }
  body { position: relative; font-family: 'DM Sans', sans-serif; color: #f2f5ea; }
  .l { position: absolute; inset: 0; }
  .bg { background: radial-gradient(ellipse 80% 55% at 50% 38%, #1d2a10 0%, #0c120a 55%, #070907 100%); }
  .glow { position: absolute; left: 50%; top: 660px; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; background: radial-gradient(circle, rgba(200,241,53,0.28), transparent 60%); }
  .beam { position: absolute; top: -200px; width: 380px; height: 2000px; transform-origin: 50% 0; background: linear-gradient(180deg, rgba(240,255,210,0.18), transparent 75%); }
  .beam.a { left: -60px; transform: rotate(-14deg); } .beam.b { right: -60px; transform: rotate(14deg); }
  .vig { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.8) 100%); }
  .pill { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 14px 36px; border: 3px solid #f2f5ea; border-radius: 999px; background: rgba(7,9,7,0.6);
          font-family: 'Space Grotesk'; font-weight: 700; font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  .pill b { color: #c8f135; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1594px; perspective: 2200px; perspective-origin: 50% 40%; }
  .prod { position: absolute; left: 50%; top: 610px; width: 420px; height: 684px; margin: -342px 0 0 -210px; transform-style: preserve-3d; transform: rotateX(6deg) rotateY(-20deg) rotateZ(-6deg); }
  .prod img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .prod img.e { filter: brightness(0.18) saturate(0.4); }
  .shadow { position: absolute; left: 50%; top: 985px; width: 440px; height: 70px; margin-left: -220px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,0.75), transparent 70%); }
  .hook { position: absolute; top: 1045px; left: 60px; right: 60px; text-align: center; font-family: 'DM Serif Display'; font-size: 104px; line-height: 1.02; text-shadow: 0 8px 40px rgba(0,0,0,0.9); }
  .hook em { font-style: normal; color: #c8f135; }
  .fact { position: absolute; top: 1330px; left: 50%; transform: translateX(-50%) rotate(-3deg); padding: 16px 30px; background: #c8f135; color: #0c120a; border-radius: 12px;
          font-family: 'Space Grotesk'; font-weight: 800; font-size: 36px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .cta { position: absolute; top: 1470px; width: 100%; text-align: center; font-family: 'Space Grotesk'; font-weight: 700; font-size: 34px; letter-spacing: 0.12em; }
  .cta b { color: #c8f135; }
</style>
</head>
<body>
  <div class="l bg"></div><div class="glow"></div><div class="beam a"></div><div class="beam b"></div><div class="l vig"></div>
  <div class="shadow"></div>
  <div class="stage"><div class="prod" id="prod"></div></div>
  <!-- EDITAR: pill -->
  <div class="pill">Tu primera pala · <b>sin postureo</b></div>
  <!-- EDITAR: gancho = el del Frame 1; la clave en <em> -->
  <div class="hook">No compres <em>la pala de pro</em></div>
  <!-- EDITAR: un dato REAL de la guía/ficha -->
  <div class="fact">Impulse Ctrl · 65 € · redonda</div>
  <div class="cta">Guía gratis en <b>empiezapadel.es</b></div>
  <script>
    // EDITAR: foto real sin fondo del producto principal (assets/img/<id>.png)
    var FOTO = 'assets/img/pala.png';
    var h = '';
    for (var z = 0; z < 7; z++) h += '<img class="e" src="' + FOTO + '" style="transform:translateZ(' + (-z * 2) + 'px)">';
    document.getElementById('prod').innerHTML = h + '<img src="' + FOTO + '" style="transform:translateZ(2px)">';
  </script>
</body>
</html>
